<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mneme workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230e1b14'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%234dffbe' font-family='sans-serif' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Mneme <span>workbench</span></div>
    <label class="tenant-picker">
      <span>Tenant</span>
      <select id="tenant" aria-label="Tenant"></select>
    </label>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-type" class="btn primary block" type="button">+ New record type</button>
      <input id="type-search" type="search" placeholder="Filter record types" aria-label="Filter record types">
      <nav id="types" aria-label="Record types"></nav>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <aside id="drawer" class="drawer" hidden></aside>
  <dialog id="editor" class="editor"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
